    <script>
        // p5.js Neural Network / Particles Background
        let particles = [];
        function setup() {
            let canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('p5-background');
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: random(width),
                    y: random(height),
                    vx: random(-0.5, 0.5),
                    vy: random(-0.5, 0.5),
                    size: random(2, 4)
                });
            }
        }

        function draw() {
            background(10, 15, 30, 255); // Solid dark base to avoid accumulation

            stroke(51, 65, 85, 80);
            strokeWeight(1);
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let d = dist(particles[i].x, particles[i].y, particles[j].x, particles[j].y);
                    if (d < 120) {
                        line(particles[i].x, particles[i].y, particles[j].x, particles[j].y);
                    }
                }
            }

            noStroke();
            fill(59, 130, 246, 180);
            for (let p of particles) {
                ellipse(p.x, p.y, p.size);
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        // Locale loading & i18n
        const localeNames = { fa: 'فارسی', en: 'English' };

        const embeddedLocales = {"fa":{"meta":{"label":"فارسی","dir":"rtl","lang":"fa"},"ui":{"title":"کدهای وضعیت HTTP","subtitle":"مرجع جامع کدهای پاسخ پروتکل HTTP به همراه توضیح فارسی، از اطلاعاتی (1xx) تا خطاهای سرور (5xx).","searchPlaceholder":"جستجو (مثل 429، درخواست زیاد...)","emptyState":"کد خطایی با این مشخصات پیدا نشد.","categories":{"all":"همه","1xx":"۱xx (اطلاعاتی)","2xx":"۲xx (موفقیت)","3xx":"۳xx (تغییر مسیر)","4xx":"۴xx (خطای کلاینت)","5xx":"۵xx (خطای سرور)"}},"codes":[{"code":100,"name":"ادامه دارد","category":"1xx","desc":"سرور هدرهای درخواست را دریافت کرده و کلاینت باید ارسال بدنه درخواست را ادامه دهد."},{"code":101,"name":"تغییر پروتکل‌ها","category":"1xx","desc":"درخواست‌کننده از سرور خواسته پروتکل را تغییر دهد و سرور تایید کرده است."},{"code":102,"name":"در حال پردازش","category":"1xx","desc":"درخواست WebDAV ممکن است شامل عملیات زیادی باشد؛ یعنی سرور درخواست را دریافت کرده و پردازش می‌کند."},{"code":103,"name":"راهنمایی‌های اولیه","category":"1xx","desc":"برای بازگرداندن برخی هدرهای پاسخ قبل از پیام نهایی HTTP استفاده می‌شود."},{"code":200,"name":"موفقیت‌آمیز (OK)","category":"2xx","desc":"پاسخ استاندارد برای درخواست‌های موفق HTTP."},{"code":201,"name":"ایجاد شد","category":"2xx","desc":"درخواست با موفقیت انجام شد و منجر به ایجاد یک منبع جدید گردید."},{"code":202,"name":"پذیرفته شد","category":"2xx","desc":"درخواست برای پردازش پذیرفته شده، اما پردازش کامل نشده است."},{"code":203,"name":"اطلاعات غیرمعتبر","category":"2xx","desc":"اطلاعات متای بازگردانده شده دقیقا همان چیزی نیست که از سرور مبدا در دسترس است."},{"code":204,"name":"بدون محتوا","category":"2xx","desc":"سرور درخواست را با موفقیت پردازش کرده اما هیچ محتوایی برنمی‌گرداند."},{"code":205,"name":"بازنشانی محتوا","category":"2xx","desc":"سرور درخواست را پردازش کرده و مایل است کلاینت نمایش سند را ریست کند."},{"code":206,"name":"محتوای جزئی","category":"2xx","desc":"سرور تنها بخش از منبع را به دلیل هدر محدوده (Range) ارسال کرده است."},{"code":207,"name":"چندین وضعیت","category":"2xx","desc":"بدنه پیام شامل یک پیام XML است که می‌تواند حاوی کدهای پاسخ جداگانه باشد."},{"code":208,"name":"از قبل گزارش شده","category":"2xx","desc":"اعضای یک اتصال DAV قبلاً در بخش قبلی پاسخ ذکر شده‌اند."},{"code":226,"name":"IM استفاده شد","category":"2xx","desc":"سرور درخواست یک منبع را اجابت کرده و پاسخ حاصل دستکاری نمونه‌ها روی نمونه فعلی است."},{"code":300,"name":"انتخاب‌های متعدد","category":"3xx","desc":"گزینه‌های متعددی برای منبع وجود دارد که کلاینت می‌تواند یکی را انتخاب کند."},{"code":301,"name":"انتقال دائم","category":"3xx","desc":"این درخواست و تمامی درخواست‌های آینده باید به آدرس جدید هدایت شوند."},{"code":302,"name":"یافت شد (انتقال موقت)","category":"3xx","desc":"انتقال موقت رایج؛ به کلاینت می‌گوید موقتاً آدرس دیگری را بررسی کند."},{"code":303,"name":"مشاهده دیگر","category":"3xx","desc":"پاسخ درخواست را می‌توان تحت یک آدرس دیگر با متد GET پیدا کرد."},{"code":304,"name":"اصلاح نشده","category":"3xx","desc":"منبع از زمان نسخه مشخص شده توسط کلاینت تغییری نکرده است."},{"code":305,"name":"استفاده از پروکسی","category":"3xx","desc":"منبع درخواستی فقط از طریق پروکسی قابل دسترسی است که آدرس آن مشخص شده."},{"code":307,"name":"تغییر مسیر موقت","category":"3xx","desc":"درخواست باید با آدرس دیگری تکرار شود، اما درخواست‌های آینده همچنان از آدرس اصلی استفاده کنند."},{"code":308,"name":"تغییر مسیر دائم","category":"3xx","desc":"درخواست و تمامی درخواست‌های بعدی باید با آدرس دیگری تکرار شوند."},{"code":400,"name":"درخواست نامعتبر","category":"4xx","desc":"سرور به دلیل خطای کلاینت (مانند فرمت اشتباه) نمی‌تواند درخواست را پردازش کند."},{"code":401,"name":"عدم احراز هویت","category":"4xx","desc":"احراز هویت مورد نیاز است اما انجام نشده یا نامعتبر است."},{"code":402,"name":"نیاز به پرداخت","category":"4xx","desc":"برای استفاده از این سرویس پرداخت مالی لازم است."},{"code":403,"name":"دسترسی ممنوع","category":"4xx","desc":"درخواست معتبر است اما سرور به دلیل نداشتن مجوز اجازه دسترسی نمی‌دهد."},{"code":404,"name":"یافت نشد","category":"4xx","desc":"منبع درخواستی روی سرور وجود ندارد یا پیدا نشد."},{"code":405,"name":"متد غیرمجاز","category":"4xx","desc":"متد ارسال شده (مثل POST یا GET) برای این منبع پشتیبانی نمی‌شود."},{"code":406,"name":"غیرقابل قبول","category":"4xx","desc":"منبع نمی‌تواند محتوایی بر اساس هدرهای Accept کلاینت تولید کند."},{"code":407,"name":"نیاز به احراز هویت پروکسی","category":"4xx","desc":"کلاینت باید ابتدا با پروکسی احراز هویت کند."},{"code":408,"name":"پایان زمان درخواست","category":"4xx","desc":"سرور در انتظار ارسال درخواست از سوی کلاینت معطل شد و تایم‌اوت داد."},{"code":409,"name":"تضاد (Conflict)","category":"4xx","desc":"درخواست به دلیل مغایرت با وضعیت فعلی منبع قابل پردازش نیست."},{"code":410,"name":"از دست رفته (Gone)","category":"4xx","desc":"منبع درخواستی دیگر وجود ندارد و برای همیشه پاک شده است."},{"code":411,"name":"نیاز به تعیین طول","category":"4xx","desc":"طول بدنه درخواست مشخص نشده و سرور آن را الزامی می‌داند."},{"code":412,"name":"شکست پیش‌شرط","category":"4xx","desc":"سرور پیش‌شرط‌هایی که کلاینت در هدر فرستاده را برآورده نمی‌کند."},{"code":413,"name":"حجم پیام بیش از حد بزرگ","category":"4xx","desc":"حجم داده‌های ارسالی کلاینت بیشتر از حد مجاز سرور است."},{"code":414,"name":"آدرس URI بسیار طولانی","category":"4xx","desc":"طول آدرس اینترنتی درخواست شده از حد مجاز سرور بیشتر است."},{"code":415,"name":"نوع رسانه پشتیبانی نمی‌شود","category":"4xx","desc":"فرمت داده‌های ارسالی (Content-Type) برای سرور شناخته شده نیست."},{"code":416,"name":"محدوده درخواست نامعتبر","category":"4xx","desc":"بخش درخواستی از فایل قابل ارائه توسط سرور نیست."},{"code":417,"name":"شکست در انتظار (Expectation)","category":"4xx","desc":"انتظار مشخص شده در هدر Expect توسط سرور قابل برآورده شدن نیست."},{"code":418,"name":"من یک قوری هستم!","category":"4xx","desc":"یک شوخی استاندارد اینترنت (RFC 2324)؛ سرور از دم کردن قهوه امتناع می‌کند چون قوری است."},{"code":421,"name":"درخواست هدایت‌شده اشتباه","category":"4xx","desc":"درخواست به سروری ارسال شده که توانایی پاسخگویی به آن را ندارد."},{"code":422,"name":"موجودیت غیرقابل پردازش","category":"4xx","desc":"درخواست از نظر نگارشی درست است اما به دلیل خطای معنایی قابل پردازش نیست (رایج در API)."},{"code":423,"name":"قفل شده","category":"4xx","desc":"منبعی که به آن دسترسی دارید قفل است."},{"code":424,"name":"وابستگی ناموفق","category":"4xx","desc":"درخواست به دلیل شکست درخواست قبلی متوقف شد."},{"code":425,"name":"خیلی زود","category":"4xx","desc":"سرور تمایلی به ریسک پردازش درخواستی که ممکن است تکراری باشد ندارد."},{"code":426,"name":"نیاز به ارتقاء پروتکل","category":"4xx","desc":"کلاینت باید پروتکل خود را ارتقاء دهد تا سرور درخواست را انجام دهد."},{"code":428,"name":"نیاز به پیش‌شرط","category":"4xx","desc":"سرور نیازمند شرطی‌بودن درخواست است."},{"code":429,"name":"درخواست‌های بیش از حد (Rate Limit)","category":"4xx","desc":"کاربر در بازه زمانی مشخص درخواست‌های زیادی ارسال کرده است (محدودیت نرخ)."},{"code":431,"name":"هدرهای درخواست بیش از حد بزرگ","category":"4xx","desc":"اندازه فیلدهای هدر درخواست از حد مجاز سرور بیشتر است."},{"code":451,"name":"غیرقابل دسترس به دلایل قانونی","category":"4xx","desc":"دستور قانونی برای مسدودسازی دسترسی به این منبع صادر شده است."},{"code":500,"name":"خطای داخلی سرور","category":"5xx","desc":"خطای عمومی؛ سرور با حالت غیرمنتظره‌ای مواجه شده و جزئیات خاص تری وجود ندارد."},{"code":501,"name":"پیاده‌سازی نشده","category":"5xx","desc":"سرور متد درخواست را نمی‌شناسد یا توانایی انجام آن را ندارد."},{"code":502,"name":"درگاه بد (Bad Gateway)","category":"5xx","desc":"سرور به عنوان پروکسی یا گیت‌وی پاسخ نامعتبری از سرور بالادستی دریافت کرده است."},{"code":503,"name":"سرویس در دسترس نیست","category":"5xx","desc":"سرور به دلیل بار زیاد یا تعمیرات موقتاً قادر به پاسخگویی نیست."},{"code":504,"name":"پایان مهلت درگاه (Gateway Timeout)","category":"5xx","desc":"سرور به عنوان پروکسی پاسخی به موقع از سرور بالادستی دریافت نکرده است."},{"code":505,"name":"نسخه HTTP پشتیبانی نمی‌شود","category":"5xx","desc":"نسخه پروتکل HTTP استفاده شده در درخواست توسط سرور پشتیبانی نمی‌شود."},{"code":506,"name":"متغیر مذاکره می‌کند","category":"5xx","desc":"مذا ers."},{"code":413,"name":"Payload Too Large","category":"4xx","desc":"The data sent by the client is larger than the server's allowed limit."},{"code":414,"name":"URI Too Long","category":"4xx","desc":"The length of the requested URL exceeds the server's allowed limit."},{"code":415,"name":"Unsupported Media Type","category":"4xx","desc":"The format of the sent data (Content-Type) is not recognized by the server."},{"code":416,"name":"Range Not Satisfiable","category":"4xx","desc":"The requested part of the file cannot be served by the server."},{"code":417,"name":"Expectation Failed","category":"4xx","desc":"The expectation specified in the Expect header cannot be met by the server."},{"code":418,"name":"I'm a teapot","category":"4xx","desc":"A standard internet joke (RFC 2324); the server refuses to brew coffee because it is a teapot."},{"code":421,"name":"Misdirected Request","category":"4xx","desc":"The request was sent to a server that cannot respond to it."},{"code":422,"name":"Unprocessable Entity","category":"4xx","desc":"The request is syntactically correct but semantically invalid (common in APIs)."},{"code":423,"name":"Locked","category":"4xx","desc":"The resource you are accessing is locked."},{"code":424,"name":"Failed Dependency","category":"4xx","desc":"The request failed because a previous request failed."},{"code":425,"name":"Too Early","category":"4xx","desc":"The server is unwilling to risk processing a request that might be a replay."},{"code":426,"name":"Upgrade Required","category":"4xx","desc":"The client must upgrade its protocol for the server to fulfill the request."},{"code":428,"name":"Precondition Required","category":"4xx","desc":"The server requires the request to be conditional."},{"code":429,"name":"Too Many Requests","category":"4xx","desc":"The user has sent too many requests in a given time period (rate limit)."},{"code":431,"name":"Header Fields Too Large","category":"4xx","desc":"The size of the request header fields exceeds the server's limit."},{"code":451,"name":"Unavailable For Legal Reasons","category":"4xx","desc":"A legal order has been issued to block access to this resource."},{"code":500,"name":"Internal Server Error","category":"5xx","desc":"A generic error; the server encountered an unexpected condition and no more specific message is available."},{"code":501,"name":"Not Implemented","category":"5xx","desc":"The server does not recognize the request method or cannot fulfill it."},{"code":502,"name":"Bad Gateway","category":"5xx","desc":"The server, acting as a proxy or gateway, received an invalid response from the upstream server."},{"code":503,"name":"Service Unavailable","category":"5xx","desc":"The server is temporarily unable to respond due to high load or maintenance."},{"code":504,"name":"Gateway Timeout","category":"5xx","desc":"The server, acting as a proxy, did not receive a timely response from the upstream server."},{"code":505,"name":"HTTP Version Not Supported","category":"5xx","desc":"The HTTP protocol version used in the request is not supported by the server."},{"code":506,"name":"Variant Also Negotiates","category":"5xx","desc":"Transparent content negotiation for the request leads to a circular reference."},{"code":507,"name":"Insufficient Storage","category":"5xx","desc":"The server is unable to store the representation needed to complete the request."},{"code":508,"name":"Loop Detected","category":"5xx","desc":"The server encountered an infinite loop while processing the request."},{"code":510,"name":"Not Extended","category":"5xx","desc":"Further extensions to the protocol are required to complete the request."},{"code":511,"name":"Network Authentication Required","category":"5xx","desc":"The client must authenticate to access the network."}]}};

        let lang = 'fa';
        let currentFilter = 'all';
        let searchQuery = '';

        const grid = document.getElementById('codesGrid');
        const searchInput = document.getElementById('searchInput');
        const filterButtons = document.querySelectorAll('#filterButtons button');
        const emptyState = document.getElementById('emptyState');
        const langSelect = document.getElementById('langSelect');
        const pageTitle = document.getElementById('pageTitle');
        const pageSubtitle = document.getElementById('pageSubtitle');

        function applyLang(locale) {
            const t = locale.ui;
            const isEn = locale.meta.lang === 'en';

            document.documentElement.lang = locale.meta.lang;
            document.documentElement.dir = locale.meta.dir;
            document.title = t.title;

            pageTitle.textContent = t.title;
            pageSubtitle.textContent = t.subtitle;
            searchInput.placeholder = t.searchPlaceholder;
            emptyState.textContent = t.emptyState;

            searchInput.classList.toggle('text-right', !isEn);
            searchInput.classList.toggle('text-left', isEn);

            filterButtons.forEach(btn => {
                btn.textContent = t.categories[btn.dataset.filter];
            });
        }

        function render() {
            const filtered = codes.filter(item => {
                const matchesFilter = currentFilter === 'all' || item.category === currentFilter;
                const q = searchQuery.toLowerCase();
                const matchesSearch = item.code.toString().includes(q) ||
                                      item.name.toLowerCase().includes(q) ||
                                      item.desc.toLowerCase().includes(q);
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = filtered.map(item => `
                <div class="backdrop-blur-md bg-slate-900/60 border border-slate-800/80 rounded-2xl p-5 flex flex-col justify-between hover:border-slate-700 transition-all shadow-lg hover:shadow-blue-500/5">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-2xl font-black text-white tracking-tight">${item.code}</span>
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-md ${getBadgeColor(item.category)}">${item.category}</span>
                        </div>
                        <h3 class="text-md font-bold text-slate-100 mb-1">${item.name}</h3>
                        <p class="text-xs text-slate-300 leading-relaxed">${item.desc}</p>
                    </div>
                </div>
            `).join('');
        }

        function getBadgeColor(cat) {
            switch(cat) {
                case '1xx': return 'bg-sky-500/10 text-sky-400 border border-sky-500/20';
                case '2xx': return 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                case '3xx': return 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
                case '4xx': return 'bg-rose-500/10 text-rose-400 border border-rose-500/20';
                case '5xx': return 'bg-purple-500/10 text-purple-400 border border-purple-500/20';
                default: return 'bg-slate-800 text-slate-300';
            }
        }

        // Load from embedded locales (works even on file:// where fetch is blocked);
        // falls back to live fetch of locales/<key>.json when available.
        function setLangFrom(locale) {
            codes = locale.codes;
            lang = locale.meta.lang;
            applyLang(locale);
            render();
        }

        async function loadLang(key) {
            if (embeddedLocales[key]) return embeddedLocales[key];
            const res = await fetch(`locales/${key}.json`);
            if (!res.ok) throw new Error(`Failed to load locale: ${key}`);
            return res.json();
        }

        langSelect.addEventListener('change', async (e) => {
            const key = e.target.value;
            try {
                setLangFrom(await loadLang(key));
            } catch (err) {
                console.error(err);
            }
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            render();
        });

        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-600/30');
                    b.classList.add('bg-slate-900/80', 'border', 'border-slate-800', 'text-slate-400');
                });
                btn.classList.remove('bg-slate-900/80', 'border', 'border-slate-800', 'text-slate-400');
                btn.classList.add('bg-blue-600', 'text-white', 'shadow-lg', 'shadow-blue-600/30');

                currentFilter = btn.dataset.filter;
                render();
            });
        });

        // Populate language dropdown
        Object.keys(localeNames).forEach(key => {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = localeNames[key];
            if (key === lang) opt.selected = true;
            langSelect.appendChild(opt);
        });

        // Load default language (Persian) on start — from embedded locales (works even on file://)
        setLangFrom(embeddedLocales.fa);
    </script>
